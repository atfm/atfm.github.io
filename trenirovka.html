<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0f1419" />
  <title>Тренировка — Day A</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface2: #243044;
      --text: #e8edf4;
      --muted: #8b9cb3;
      --accent: #5b9fd4;
      --accent2: #6bc9a8;
      --warn: #e8b86d;
      --border: #2d3a4f;
      --radius: 14px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
      --header-h: 4.5rem;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding: 0 0 5rem;
    }
    .sticky {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 20, 25, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: calc(0.7rem + env(safe-area-inset-top, 0px)) 1rem 0.75rem;
    }
    .sticky-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      max-width: 42rem;
      margin: 0 auto;
    }
    .sticky h1 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .day-badge {
      display: inline-block;
      margin-top: 0.25rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent2);
    }
    .meta {
      margin: 0.15rem 0 0;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .progress-box {
      flex-shrink: 0;
      text-align: right;
    }
    .progress-num {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent2);
      font-variant-numeric: tabular-nums;
    }
    .progress-label {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .bar-wrap {
      height: 5px;
      background: var(--surface2);
      border-radius: 99px;
      margin-top: 0.55rem;
      max-width: 42rem;
      margin-left: auto;
      margin-right: auto;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      transition: width 0.25s ease;
    }
    .wrap {
      max-width: 42rem;
      margin: 0 auto;
      padding: 1rem 0.9rem 0;
    }
    .toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 0.75rem;
    }
    .ghost {
      font: inherit;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      min-height: 44px;
      cursor: pointer;
    }
    .ghost:active { transform: scale(0.98); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 0.95rem 0.95rem;
      margin-bottom: 1rem;
      transition: opacity 0.2s ease, border-color 0.2s ease;
    }
    .card.done {
      opacity: 0.55;
      border-color: var(--accent2);
    }
    .card-head {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.55rem;
    }
    .ex-index {
      flex-shrink: 0;
      width: 1.85rem;
      height: 1.85rem;
      border-radius: 8px;
      background: var(--surface2);
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      display: grid;
      place-items: center;
      margin-top: 0.15rem;
    }
    .card.done .ex-index {
      background: var(--accent2);
      color: #0a1018;
    }
    .ex-name {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }
    .prescription {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0.55rem 0 0.75rem;
    }
    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.28rem 0.7rem;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .chip.rest { color: var(--warn); }
    .media {
      background: #0a0e13;
      border-radius: 10px;
      overflow: hidden;
      margin: 0 0 0.75rem;
      min-height: 220px;
      display: grid;
      place-items: center;
    }
    .media img,
    .media video {
      width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: contain;
      display: block;
      background: #0a0e13;
    }
    .notes {
      margin: 0 0 0.85rem;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .done-btn {
      width: 100%;
      min-height: 52px;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      background: var(--surface2);
      color: var(--text);
      padding: 0.85rem 1rem;
    }
    .done-btn:active { transform: scale(0.985); }
    .card.done .done-btn {
      background: var(--accent2);
      color: #0a1018;
    }
    .done-all {
      text-align: center;
      padding: 1.5rem 1rem;
      color: var(--accent2);
      font-weight: 600;
      display: none;
    }
    .done-all.show { display: block; }
    .noscript {
      margin: 1rem;
      padding: 1rem;
      background: var(--surface);
      border-radius: var(--radius);
    }
  </style>
</head>
<body>
  <!--
    EDIT ONLY the workout data array; keep layout/CSS.
    Завтрашняя тренировка = правка объекта WORKOUT ниже. Вёрстку не трогать.
  -->
  <header class="sticky">
    <div class="sticky-row">
      <div>
        <h1 id="workoutTitle">Тренировка</h1>
        <span class="day-badge" id="dayLabel"></span>
        <p class="meta" id="dateLabel"></p>
      </div>
      <div class="progress-box">
        <span class="progress-label">готово</span>
        <span class="progress-num" id="progressNum">0/0</span>
      </div>
    </div>
    <div class="bar-wrap"><div class="bar-fill" id="barFill"></div></div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <button type="button" class="ghost" id="resetBtn">Сбросить отметки</button>
    </div>
    <div id="list"></div>
    <p class="done-all" id="doneAll">Все упражнения отмечены. Можно в душ.</p>
  </main>

  <noscript>
    <p class="noscript">Нужен JavaScript, чтобы собрать карточки из списка упражнений.</p>
  </noscript>

  <script>
    // EDIT ONLY the workout data array; keep layout/CSS.
    // Меняйте только WORKOUT. Поля упражнения: name, sets, reps, restSec, gifUrl, notes?
    // gifUrl: прямая ссылка на GIF/WebP/JPG (тег img) или MP4 (тег video, autoplay/loop/mute).
    const WORKOUT = {
      title: "Тренировка",
      dateLabel: "дома · гантели + коврик",
      dayLabel: "Day C — всё тело",
      exercises: [
        {
          name: "Присед с гантелями / Goblet squat",
          sets: 3,
          reps: "10",
          restSec: 75,
          gifUrl: "https://media.musclewiki.com/media/uploads/videos/branded/male-dumbbell-goblet-squat-front.mp4",
          notes: "лёгкий день; глубина комфортная, пятки в пол."
        },
        {
          name: "Отжимания (от пола или от дивана/стола) / Push-up",
          sets: 3,
          reps: "6–12",
          restSec: 60,
          gifUrl: "https://media.musclewiki.com/media/uploads/videos/branded/male-Bodyweight-push-up-front.mp4",
          notes: "до комфортного отказа в диапазоне 6–12; при необходимости руки на возвышении."
        },
        {
          name: "Ягодичный мост / Glute bridge",
          sets: 3,
          reps: "12–15",
          restSec: 60,
          gifUrl: "https://media.musclewiki.com/media/uploads/videos/branded/male-Bodyweight-glute-bridge-front.mp4",
          notes: "на коврике, пауза сверху, не прогибаться в пояснице."
        },
        {
          name: "Тяга в наклоне двумя руками / Dumbbell bent-over row",
          sets: 3,
          reps: "10",
          restSec: 75,
          gifUrl: "https://fitnessprogramer.com/wp-content/uploads/2021/02/Bent-Over-Dumbbell-Row.gif",
          notes: "спина прямая, тянем к поясу, локти вдоль корпуса."
        },
        {
          name: "Прогулка фермера / Farmer carry",
          sets: 3,
          reps: "30–40 с",
          restSec: 60,
          gifUrl: "https://fitnessprogramer.com/wp-content/uploads/2022/02/Farmers-walk_Cardio.gif",
          notes: "гантели в руках, ровная осанка, ходите по квартире."
        }
      ]
    };

    const STORAGE_KEY = "trenirovka-done:" + WORKOUT.dayLabel;

    function loadDone() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return new Set(Array.isArray(arr) ? arr : []);
      } catch (e) {
        return new Set();
      }
    }

    function saveDone(done) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...done]));
    }

    function isVideo(url) {
      return /\.(mp4|webm|mov)(\?|$)/i.test(url || "");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function restLabel(sec) {
      if (!sec) return "";
      return "отдых " + sec + " с";
    }

    function mediaHtml(ex) {
      const url = ex.gifUrl;
      if (!url) return "";
      if (isVideo(url)) {
        return (
          '<div class="media">' +
            '<video src="' + escapeHtml(url) + '" autoplay muted loop playsinline webkit-playsinline></video>' +
          "</div>"
        );
      }
      return (
        '<div class="media">' +
          '<img src="' + escapeHtml(url) + '" alt="' + escapeHtml(ex.name) + '" />' +
        "</div>"
      );
    }

    function render() {
      document.title = WORKOUT.title + " — " + WORKOUT.dayLabel;
      document.getElementById("workoutTitle").textContent = WORKOUT.title;
      document.getElementById("dayLabel").textContent = WORKOUT.dayLabel;
      document.getElementById("dateLabel").textContent = WORKOUT.dateLabel || "";

      const done = loadDone();
      const list = document.getElementById("list");
      list.innerHTML = WORKOUT.exercises.map(function (ex, i) {
        const id = String(i);
        const isDone = done.has(id);
        return (
          '<article class="card' + (isDone ? " done" : "") + '" data-id="' + id + '">' +
            '<div class="card-head">' +
              '<span class="ex-index">' + (i + 1) + "</span>" +
              '<h2 class="ex-name">' + escapeHtml(ex.name) + "</h2>" +
            "</div>" +
            '<div class="prescription">' +
              '<span class="chip">' + escapeHtml(ex.sets) + "×" + escapeHtml(ex.reps) + "</span>" +
              (ex.restSec ? '<span class="chip rest">' + restLabel(ex.restSec) + "</span>" : "") +
            "</div>" +
            mediaHtml(ex) +
            (ex.notes ? '<p class="notes">' + escapeHtml(ex.notes) + "</p>" : "") +
            '<button type="button" class="done-btn" data-id="' + id + '" aria-pressed="' + isDone + '">' +
              (isDone ? "Сделано ✓" : "Готово") +
            "</button>" +
          "</article>"
        );
      }).join("");

      updateProgress(done);
    }

    function updateProgress(done) {
      const total = WORKOUT.exercises.length;
      const n = [...done].filter(function (id) {
        return Number(id) < total;
      }).length;
      document.getElementById("progressNum").textContent = n + "/" + total;
      document.getElementById("barFill").style.width = (total ? (n / total) * 100 : 0) + "%";
      document.getElementById("doneAll").classList.toggle("show", total > 0 && n === total);
    }

    function toggle(id) {
      const done = loadDone();
      if (done.has(id)) done.delete(id);
      else done.add(id);
      saveDone(done);

      const card = document.querySelector('.card[data-id="' + id + '"]');
      const btn = document.querySelector('.done-btn[data-id="' + id + '"]');
      const on = done.has(id);
      if (card) card.classList.toggle("done", on);
      if (btn) {
        btn.setAttribute("aria-pressed", on);
        btn.textContent = on ? "Сделано ✓" : "Готово";
      }
      updateProgress(done);
    }

    document.getElementById("list").addEventListener("click", function (e) {
      const btn = e.target.closest(".done-btn");
      if (btn) toggle(btn.getAttribute("data-id"));
    });

    document.getElementById("resetBtn").addEventListener("click", function () {
      localStorage.removeItem(STORAGE_KEY);
      render();
    });

    render();
  </script>
</body>
</html>
