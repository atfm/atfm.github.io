<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ПРИКИНЬ!!!!!! — Козловский</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Russo+One&display=swap" rel="stylesheet" />
  <style>
    :root {
      --slag: #0c1218;
      --ice: #7ec8d8;
      --frost: #eef6f8;
      --blood: #c23b22;
      --steel: #9eb0ba;
      --font-shout: "Bebas Neue", Impact, sans-serif;
      --font-stamp: "Russo One", "Arial Black", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-stamp);
      color: var(--frost);
      background: var(--slag);
    }

    .scene {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      overflow: hidden;
      padding: clamp(1.25rem, 4vh, 2.5rem) 1rem clamp(2rem, 6vh, 3.5rem);
      text-align: center;
    }

    .hero-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 12%;
      z-index: 0;
      animation: breathe 8s ease-in-out infinite alternate;
      filter: contrast(1.08) saturate(0.9) brightness(0.88);
    }

    .veil {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(
          180deg,
          rgba(12, 18, 24, 0.25) 0%,
          rgba(12, 18, 24, 0.15) 40%,
          rgba(12, 18, 24, 0.55) 70%,
          rgba(12, 18, 24, 0.92) 100%
        ),
        radial-gradient(ellipse 70% 40% at 50% 100%, rgba(194, 59, 34, 0.18), transparent 60%);
      animation: veil-pulse 6s ease-in-out infinite alternate;
    }

    .brand {
      position: relative;
      z-index: 2;
      margin: 0 0 0.65rem;
      font-family: var(--font-stamp);
      font-size: clamp(1.35rem, 4.5vw, 2.1rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ice);
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.75);
      animation: rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .runners {
      position: relative;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.04em;
      margin: 0;
      line-height: 0.95;
    }

    .runners .ch {
      display: inline-block;
      font-family: var(--font-shout);
      font-size: clamp(3.4rem, 15vw, 8rem);
      color: var(--frost);
      text-shadow:
        0 0 2px var(--slag),
        3px 4px 0 var(--blood),
        0 10px 28px rgba(0, 0, 0, 0.6);
      transform-origin: bottom center;
      --run-x: 28px;
      animation:
        run-legs 0.38s cubic-bezier(0.35, 0.05, 0.2, 1) infinite,
        run-track 1.8s linear infinite,
        hue-flash 3s ease-in-out infinite;
      will-change: transform;
    }

    .runners .ch:nth-child(1)  { --dir: 1;  --run-x: 36px; animation-delay: 0s, 0s, 0s; }
    .runners .ch:nth-child(2)  { --dir: -1; --run-x: 44px; animation-delay: 0.03s, -0.15s, 0.12s; }
    .runners .ch:nth-child(3)  { --dir: 1;  --run-x: 52px; animation-delay: 0.06s, -0.3s, 0.24s; }
    .runners .ch:nth-child(4)  { --dir: -1; --run-x: 40px; animation-delay: 0.09s, -0.45s, 0.36s; }
    .runners .ch:nth-child(5)  { --dir: 1;  --run-x: 60px; animation-delay: 0.12s, -0.6s, 0.48s; }
    .runners .ch:nth-child(6)  { --dir: -1; --run-x: 48px; animation-delay: 0.15s, -0.75s, 0.6s; }
    .runners .ch:nth-child(7)  { --dir: 1;  --run-x: 56px; animation-delay: 0.04s, -0.9s, 0.72s; }
    .runners .ch:nth-child(8)  { --dir: -1; --run-x: 32px; animation-delay: 0.08s, -1.05s, 0.84s; }
    .runners .ch:nth-child(9)  { --dir: 1;  --run-x: 68px; animation-delay: 0.11s, -1.2s, 0.96s; }
    .runners .ch:nth-child(10) { --dir: -1; --run-x: 42px; animation-delay: 0.14s, -1.35s, 1.08s; }
    .runners .ch:nth-child(11) { --dir: 1;  --run-x: 50px; animation-delay: 0.17s, -1.5s, 1.2s; }
    .runners .ch:nth-child(12) { --dir: -1; --run-x: 58px; animation-delay: 0.05s, -1.65s, 1.32s; }
    .runners .ch:nth-child(13) { --dir: 1;  --run-x: 46px; animation-delay: 0.1s, -1.8s, 1.44s; }

    .lede {
      position: relative;
      z-index: 2;
      margin-top: 0.85rem;
      max-width: 28rem;
      font-size: clamp(0.85rem, 2.2vw, 1.05rem);
      letter-spacing: 0.06em;
      color: var(--steel);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
      animation: rise 0.95s 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes run-legs {
      0%, 100% {
        transform:
          translateY(0)
          rotate(calc(var(--dir, 1) * -10deg))
          skewX(calc(var(--dir, 1) * -8deg));
      }
      25% {
        transform:
          translateY(-28%)
          rotate(calc(var(--dir, 1) * 8deg))
          skewX(calc(var(--dir, 1) * 6deg));
      }
      50% {
        transform:
          translateY(0)
          rotate(calc(var(--dir, 1) * -6deg))
          skewX(calc(var(--dir, 1) * -10deg))
          scaleY(0.88);
      }
      75% {
        transform:
          translateY(-18%)
          rotate(calc(var(--dir, 1) * 12deg))
          skewX(calc(var(--dir, 1) * 7deg));
      }
    }

    @keyframes run-track {
      0%   { translate: calc(var(--dir, 1) * -1 * var(--run-x)) 0; }
      50%  { translate: calc(var(--dir, 1) * var(--run-x)) -4px; }
      100% { translate: calc(var(--dir, 1) * -1 * var(--run-x)) 0; }
    }

    @keyframes hue-flash {
      0%, 100% { color: var(--frost); }
      40% { color: var(--ice); }
      70% { color: #ffd9c4; }
    }

    @keyframes breathe {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    @keyframes veil-pulse {
      from { opacity: 0.85; }
      to { opacity: 1; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-photo,
      .veil,
      .brand,
      .lede,
      .runners .ch {
        animation: none !important;
      }
      .runners .ch {
        transform: none;
        translate: none;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <img
      class="hero-photo"
      src="assets/kozlovsky-oleg.jpg"
      alt="Данила Козловский в роли князя Олега, сериал Викинги"
      width="900"
      height="1179"
    />
    <div class="veil" aria-hidden="true"></div>

    <h1 class="brand">Козловский</h1>
    <p class="runners" aria-label="ПРИКИНЬ!!!!!!">
      <span class="ch" aria-hidden="true">П</span>
      <span class="ch" aria-hidden="true">Р</span>
      <span class="ch" aria-hidden="true">И</span>
      <span class="ch" aria-hidden="true">К</span>
      <span class="ch" aria-hidden="true">И</span>
      <span class="ch" aria-hidden="true">Н</span>
      <span class="ch" aria-hidden="true">Ь</span>
      <span class="ch" aria-hidden="true">!</span>
      <span class="ch" aria-hidden="true">!</span>
      <span class="ch" aria-hidden="true">!</span>
      <span class="ch" aria-hidden="true">!</span>
      <span class="ch" aria-hidden="true">!</span>
      <span class="ch" aria-hidden="true">!</span>
    </p>
    <p class="lede">князь Олег из «Викингов» · буквы бегают сами</p>
  </main>
</body>
</html>
